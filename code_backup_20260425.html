<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>비행기 준비물</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0064ff",
                        "background": "#f2f4f6",
                        "surface": "#ffffff",
                        "on-surface": "#191f28",
                        "secondary": "#8b95a1",
                        "outline-variant": "#e5e8eb"
                    },
                    borderRadius: {
                        "xxl": "24px",
                        "xl": "16px",
                        "lg": "12px"
                    },
                    spacing: {
                        "container-margin": "20px",
                        "lg": "24px",
                        "md": "16px",
                        "sm": "8px"
                    },
                    fontFamily: {
                        "manrope": ["Manrope", "sans-serif"],
                        "inter": ["Inter", "sans-serif"]
                    },
                    animation: {
                        'slide-up': 'slide-up 0.4s cubic-bezier(0.4, 0, 0.2, 1)',
                        'fade-in': 'fade-in 0.3s ease-out'
                    },
                    keyframes: {
                        'slide-up': {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        'fade-in': {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* [1] 스크롤바 제어 */
        body::-webkit-scrollbar {
            width: 4px;
        }

        body::-webkit-scrollbar-thumb {
            background-color: transparent;
            border-radius: 10px;
            transition: background-color 0.3s;
        }

        body.is-scrolling::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.1);
        }

        /* [2] 탭 피드백 및 호버 효과 */
        .tap-feedback {
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        @media (hover: hover) {
            .tap-feedback:hover {
                /* 회색 오버레이 제거 */
            }
        }

        .tap-feedback:active {
            transform: scale(0.96);
        }

        .onboarding-btn:active {
            border-color: #0064ff;
            background-color: #ffffff;
            box-shadow: 0 0 0 1px #0064ff;
        }

        body {
            background-color: #f2f4f6;
            user-select: none;
            -webkit-user-select: none;
        }

        .view-transition {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
        }

        @keyframes soft-pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.85;
                transform: scale(1.05);
            }
        }

        .animate-soft-pulse {
            animation: soft-pulse 2s infinite ease-in-out;
        }

        .subtext-container {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out, margin-top 0.3s ease-out;
            overflow: hidden;
        }

        .subtext-visible {
            max-height: 100px;
            opacity: 1;
            margin-top: 4px;
        }

        .subtext-hidden {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }
    </style>
</head>

<body class="text-on-surface font-inter overflow-x-hidden">

    <!-- Onboarding Overlay -->
    <div id="onboarding-overlay" class="fixed inset-0 z-[200] bg-surface flex flex-col view-transition">
        <div id="step1-view" class="flex-1 flex flex-col pt-20 px-container-margin animate-slide-up">
            <h1 class="font-manrope text-[26px] font-extrabold leading-tight mb-10">어디로 떠나시나요? ✈️</h1>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="selectDestination('일본')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">🍣
                    일본</button>
                <button onclick="selectDestination('동남아')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">🌴
                    동남아</button>
                <button onclick="selectDestination('유럽')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">🗼
                    유럽</button>
                <button onclick="selectDestination('미국')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">🗽
                    미국</button>
                <button onclick="selectDestination('중화')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">🐼
                    중화</button>
                <button onclick="selectDestination('미정')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">🤔
                    미정</button>
            </div>
        </div>

        <div id="step2-view" class="hidden flex-1 flex flex-col pt-20 px-container-margin animate-slide-up">
            <h1 class="font-manrope text-[26px] font-extrabold leading-tight mb-10">어떤 여행인가요? 🧳</h1>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="selectTheme('일주일')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">📅일주일</button>
                <button onclick="selectTheme('한 달 살기')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">🏠한달살기</button>
                <button onclick="selectTheme('여름휴가')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">✨여름휴가</button>
                <button onclick="selectTheme('신혼여행')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">💍신혼여행</button>
                <button onclick="selectTheme('가족여행')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">🌱가족여행</button>
                <button onclick="selectTheme('미정')"
                    class="onboarding-btn tap-feedback bg-background p-6 rounded-xxl text-[18px] font-bold border-2 border-transparent text-left">🤔미정</button>
            </div>
        </div>
    </div>

    <main id="home-view" class="pt-14 pb-12 opacity-0 view-transition">
        <!-- Destination Banner (Restored) -->
        <div id="dest-banner" class="relative w-full h-[220px] overflow-hidden">
            <img id="hero-image" src="" class="w-full h-full object-cover" />
            <div
                class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent flex flex-col justify-end p-container-margin pb-8">
                <h2 id="hero-title" class="text-white text-[26px] font-extrabold leading-tight"></h2>
            </div>
        </div>

        <!-- Checklist Section -->
        <section class="px-container-margin mt-6 mb-8">
            <div class="bg-white rounded-xxl p-lg shadow-sm">
                <div id="success-banner"
                    class="hidden mb-6 p-4 bg-primary/5 rounded-xl text-center border border-primary/10 animate-soft-pulse">
                    <p class="text-primary font-bold text-[15px]">준비 완료! 즐거운 여행 되세요 ✈️</p>
                </div>

                <div class="flex items-center justify-between mb-1 px-1">
                    <div class="flex items-center gap-1.5">
                        <h3 id="main-checklist-title" class="font-manrope text-[18px] font-bold text-on-surface">필수 준비물
                        </h3>
                        <span class="text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-secondary font-bold">광고</span>
                    </div>
                    <span id="checklist-progress"
                        class="text-[13px] font-bold text-primary bg-primary/5 px-2 py-0.5 rounded-full">0/7</span>
                </div>
                <p class="text-[11px] text-secondary/40 px-1 mb-4 leading-tight">
                    아래 서비스는 광고이며, 링크를 통한 구매 시 수수료를 지급받습니다.
                </p>

                <div id="checklist-items" class="space-y-2">
                    <!-- Items injected by JS -->
                </div>
            </div>
        </section>

        <!-- Travel Benefits Section -->
        <section class="bg-white rounded-xxl pt-8 pb-10 px-container-margin mb-8 shadow-sm mx-container-margin">
            <div class="flex items-center justify-between mb-1 px-1">
                <div class="flex items-center gap-1.5">
                    <h3 id="service-list-title" class="text-[19px] font-bold">여행 혜택 전체보기</h3>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-secondary font-bold">광고</span>
                </div>
                <span id="service-count" class="text-[13px] font-semibold text-secondary">0개</span>
            </div>
            <p class="text-[11px] text-secondary/40 px-1 mb-6 leading-tight">
                아래 서비스는 광고이며, 링크를 통한 구매 시 수수료를 지급받습니다.
            </p>

            <div id="service-list" class="space-y-1">
                <!-- Services injected by JS -->
            </div>
        </section>

        <footer class="px-container-margin py-10 text-center">
            <div class="font-manrope text-[#d1d6db] text-[11px] uppercase tracking-[0.2em] font-extrabold mb-4">
                AIRPLANE SUPPLIES
            </div>
            <p class="text-[12px] text-secondary leading-relaxed">
                본 채널은 파트너사와의 제휴를 통해 운영됩니다.<br />
                링크를 통한 구매 시 수수료를 지급받으며, <br />
                이는 서비스 운영에 사용됩니다.
            </p>
        </footer>
    </main>

                { id: 5, text: "여행자 보험", subtext: "혹시 모를 사고와 질병을 대비해 1분 만에 가입하세요.", link: { text: "아직 안 하셨다면? 최저가 보험 가입 🛡️", url: "https://www.mibankins.com/travel/" } }
            ],
            services: [
                { id: "usimsa", title: "유심사 (USIMSA)", subtitle: "방금 72명이 구매했어요! 10% 추가 할인", icon: "sim_card", link: "https://lase.kr/click.php?m=usimsa&a=A100704235&l=9999&l_cd1=3&l_cd2=0&tu=https%3A%2F%2Fwww.usimsa.com%2F", desc: "번거로운 교체 없이 QR 코드 스캔 한 번으로 전 세계 어디서나 데이터를 사용하세요.", badge: { text: "🔥실시간 급상승", color: "bg-red-500" } },

                { id: "airalo", title: "Airalo", subtitle: "첫 구매 15% 할인받기", icon: "language", link: "https://lase.kr/click.php?m=airalo&a=A100704235&l=9999&l_cd1=3&l_cd2=0&tu=https%3A%2F%2Fwww.airalo.com%2Fko", desc: "200개 이상의 국가 및 지역에서 현지 데이터 요금제로 경제적인 여행을 즐기세요." },
                { id: "myrealtrip", title: "마이리얼트립", subtitle: "현지보다 저렴한 패스권 오늘만 이 가격", icon: "confirmation_number", link: "https://lase.kr/click.php?m=myrealtrip&a=A100704235&l=9999&l_cd1=3&l_cd2=0&tu=https%3A%2F%2Fwww.myrealtrip.com%2F", desc: "여행지에서 즐길 수 있는 최고의 경험들을 가장 저렴하게 예약하세요.", badge: { text: "종료 임박", color: "bg-primary" } },

                { id: "kkday", title: "KKday", subtitle: "해외 맛집 예약 대기 없이 바로 가기", icon: "explore", link: "https://lase.kr/click.php?m=kkday&a=A100704235&l=9999&l_cd1=3&l_cd2=0&tu=https%3A%2F%2Fwww.kkday.com%2Fko", desc: "잊지 못할 여행 경험을 위한 투어, 교통편, 입장권을 한곳에서 예약하세요." },
                { id: "rakutentr", title: "라쿠텐 트래블", subtitle: "일본 료칸 10만원 할인 이벤트 중", icon: "flight_takeoff", link: "https://lase.kr/click.php?m=rakutentr&a=A100704235&l=9999&l_cd1=3&l_cd2=0&tu=https%3A%2F%2Ftravel.rakuten.com", desc: "일본 최고의 호텔과 료칸을 현지인들이 신뢰하는 가격으로 예약하세요." }
            ]
        };

        let state = {
            currentView: 'onboarding',
            selectedDestination: null,
            selectedTheme: null,
            checkedItems: JSON.parse(localStorage.getItem('airplane_checklist') || '[]')
        };

        // 스크롤바 투명도 제어
        let scrollTimeout;
        window.addEventListener('scroll', () => {
            document.body.classList.add('is-scrolling');
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                document.body.classList.remove('is-scrolling');
            }, 1000);
        }, { passive: true });

        function init() {
            renderChecklist();
            renderServiceList();
            updateProgress(true);
        }

        function selectDestination(dest) {
            state.selectedDestination = dest;
            document.getElementById('step1-view').classList.add('hidden');
            document.getElementById('step2-view').classList.remove('hidden');
        }

        function selectTheme(theme) {
            state.selectedTheme = theme;
            completeOnboarding();
        }

        function completeOnboarding() {
            const overlay = document.getElementById('onboarding-overlay');
            const home = document.getElementById('home-view');

            const d = state.selectedDestination || '미정';
            const t = state.selectedTheme || '일반';

            // 상단 배너 설정
            const heroImg = document.getElementById('hero-image');
            const heroTitle = document.getElementById('hero-title');
            if (heroImg) {
                heroImg.src = getBannerImage(d);

                // 랜드마크가 잘리지 않도록 지역별 최적 위치 설정
                const positions = {
                    '일본': 'center 15%',
                    '유럽': 'center 10%',
                    '미국': 'center 10%',
                    '중화': 'center 10%'
                };
                heroImg.style.objectPosition = positions[d] || 'center center';
            }
            if (heroTitle) heroTitle.innerText = getHeroTitle(d);

            // 카드 내부 타이틀 설정
            const mainTitleEl = document.getElementById('main-checklist-title');
            if (mainTitleEl) {
                mainTitleEl.innerText = d === '미정' ? '여행 준비물' : `${d} 여행 준비물`;
            }

            // [추가] 혜택 섹션 타이틀 변경
            const serviceTitleEl = document.getElementById('service-list-title');
            if (serviceTitleEl) {
                const destSuffix = d === '미정' ? '전체보기' : `${d} 여행 혜택`;
                serviceTitleEl.innerText = destSuffix;
            }

            overlay.style.transform = 'translateY(-100%)';
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none'; // 즉시 클릭 차단 해제

            // 서비스 리스트 및 체크리스트 렌더링
            renderServiceList();
            renderChecklist();

            // 메인 화면으로 전환
            window.scrollTo(0, 0);

            setTimeout(() => {
                overlay.classList.add('hidden');
                home.classList.remove('opacity-0');
                state.currentView = 'home';
                window.scrollTo(0, 0);
            }, 400);
        }

        function getBannerImage(dest) {
            const images = {
                '일본': 'C:/Users/iaida/.gemini/antigravity/brain/95a81636-05f7-4507-98f5-f151da07ae8f/japan_banner_manekineko_extra_large_right_1777100204843.png',
                '동남아': 'C:/Users/iaida/.gemini/antigravity/brain/95a81636-05f7-4507-98f5-f151da07ae8f/southeast_asia_banner_palm_right_1777100018053.png',
                '유럽': 'C:/Users/iaida/.gemini/antigravity/brain/95a81636-05f7-4507-98f5-f151da07ae8f/europe_banner_eiffel_right_1777100005772.png',
                '미국': 'C:/Users/iaida/.gemini/antigravity/brain/95a81636-05f7-4507-98f5-f151da07ae8f/usa_banner_right_statue_1777099788780.png',
                '중화': 'C:/Users/iaida/.gemini/antigravity/brain/95a81636-05f7-4507-98f5-f151da07ae8f/china_taiwan_banner_taipei101_right_1777100178308.png',
                '미정': 'C:/Users/iaida/.gemini/antigravity/brain/95a81636-05f7-4507-98f5-f151da07ae8f/undetermined_banner_no_text_1777088948292.png'
            };
            return images[dest] || images['미정'];
        }

        function getHeroTitle(dest) {
            const titles = {
                '일본': '골목마다 낭만이 가득한 곳,\n가벼운 마음으로 떠나볼까요',
                '동남아': '에메랄드빛 바다가 부르는 곳,\n온전한 휴식을 시작해 보세요',
                '유럽': '오랜 시간 꿈꿔온 풍경,\n발길 닿는 곳마다 그림이 될 거예요',
                '미국': '영화 속 한 장면 같은 거리,\n새로운 모험을 준비해 볼까요',
                '중화': '화려한 야경과 미식이 기다리는 곳,\n특별한 추억을 담아오세요',
                '미정': '발길이 이끄는 어느 곳이든,\n가장 완벽한 여정이 될 거예요'
            };
            return titles[dest] || titles['미정'];
        }

        function getHomeTitle(d, t) {
            if (d === '미정') return "여행 준비물";
            return `${d} 여행 준비물`;
        }

        function getChecklistTitle() {
            const d = state.selectedDestination;
            const t = state.selectedTheme;
            const isDMijung = d === '미정' || !d;
            const isTMijung = t === '미정' || !t;

            if (isDMijung && isTMijung) return "행복한 여행 위한 준비물";
            if (isDMijung) return `설레는 ${t}을 위한 준비물`;
            if (isTMijung) return `완벽한 ${d} 여행 준비물`;
            return `${d} ${t} 준비물`;
        }

        function renderChecklist() {
            const container = document.getElementById('checklist-items');
            const items = config.checklist;
            const dest = state.selectedDestination;

            let html = '';

            items.forEach((item, index) => {
                const isChecked = state.checkedItems.includes(item.id);
                const hasLink = !!item.link;

                // 8번 항목(숙소 예약) 등의 텍스트를 지역별로 동적 변경
                let currentItemText = item.text;
                let currentSubtext = item.subtext;
                let currentLinkText = item.link ? item.link.text : '';

                if (item.id === 8) { // 숙소 예약
                    if (dest === '일본') {
                        currentSubtext = "일본 가성비 숙소 70% 할인";
                        currentLinkText = "일본 호텔 특가 확인 🏨";
                    } else if (dest === '동남아') {
                        currentSubtext = "동남아 지역 인기 풀빌라";
                        currentLinkText = "동남아 풀빌라 예약 🏝️";
                    } else if (dest === '유럽') {
                        currentSubtext = "유럽 안전한 숙소 특가";
                        currentLinkText = "유럽 숙소 찾기 ✈️";
                    } else if (dest === '미국') {
                        currentSubtext = "미국 위치 좋은 숙소 특가";
                        currentLinkText = "미국 숙소 찾기 🗽";
                    } else if (dest === '중화') {
                        currentSubtext = "중화권 야경 맛집 호텔 최저가";
                        currentLinkText = "중화권 호텔 보기 🌃";
                    }
                }

                // 체크리스트 항목 렌더링
                if (isChecked) {
                    html += `
                    <div class="px-1 py-1">
                        <div class="tap-feedback flex items-center justify-between p-3 rounded-xl" onclick="toggleCheck(${item.id})">
                            <span class="text-[16px] text-on-surface font-bold">${currentItemText}</span>
                            <div class="w-6 h-6 bg-primary border-2 border-primary rounded-full flex items-center justify-center transition-all">
                                <span class="material-symbols-outlined text-white text-[14px]">check</span>
                            </div>
                        </div>
                    </div>
                    `;
                } else {
                    html += `
                    <div class="px-1 py-1 mb-4">
                        <div class="tap-feedback flex items-center justify-between p-3 pb-1 rounded-xl" onclick="toggleCheck(${item.id})">
                            <span class="text-[16px] text-on-surface font-bold">${currentItemText}</span>
                            <div class="w-6 h-6 border-2 border-outline-variant rounded-full flex items-center justify-center bg-white transition-all">
                                 <span class="material-symbols-outlined text-white text-[14px]">check</span>
                            </div>
                        </div>
                        
                        <div class="pl-3 pr-3 pb-2">
                            ${currentSubtext ? `<p class="text-[13px] text-secondary leading-snug mb-3">${currentSubtext}</p>` : ''}
                            
                            ${hasLink ? `
                                <button onclick="window.open('${item.link.url}', '_blank'); event.stopPropagation();" 
                                    class="tap-feedback w-full py-3 bg-primary text-white rounded-xl text-[13px] font-bold shadow-sm flex items-center justify-center">
                                    ${currentLinkText}
                                </button>
                            ` : `
                                <div class="h-2"></div>
                            `}
                        </div>
                    </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        function renderServiceList() {
            const container = document.getElementById('service-list');
            const countContainer = document.getElementById('service-count');
            const dest = state.selectedDestination;

            // 1. 목적지에 따른 서비스 필터링 (라쿠텐 트래블은 일본 선택 시에만)
            let filteredServices = config.services.filter(service => {
                if (service.id === 'rakutentr') {
                    return dest === '일본';
                }
                return true;
            });

            // 2. 목적지에 따른 특정 서비스 텍스트 변경 (호텔스컴바인 등)
            const mappedServices = filteredServices.map(service => {
                let currentService = { ...service };

                if (currentService.id === 'hcombine2') {
                    if (dest === '일본') {
                        currentService.subtitle = "일본 가성비 숙소 70% 할인";
                    } else if (dest === '동남아') {
                        currentService.subtitle = "동남아 지역 인기 풀빌라";
                    } else if (dest === '유럽') {
                        currentService.subtitle = "유럽 안전한 숙소 특가";
                    } else if (dest === '미국') {
                        currentService.subtitle = "미국 위치 좋은 숙소 특가";
                    } else if (dest === '중화') {
                        currentService.subtitle = "중화권 야경 맛집 호텔 최저가";
                    } else {
                        currentService.subtitle = "전 세계 인기 호텔 최저가 비교";
                    }
                }

                return currentService;
            });

            if (countContainer) {
                countContainer.innerText = `${mappedServices.length}개`;
            }

            container.innerHTML = mappedServices.map(service => `
                <button onclick="window.open('${service.link}', '_blank')" 
                    class="tap-feedback w-full flex items-center gap-4 p-4 rounded-xxl text-left group">
                    <div class="w-12 h-12 bg-gray-50 flex items-center justify-center rounded-full text-primary 
                                group-active:bg-gray-200 transition-all">
                        <span class="material-symbols-outlined text-[26px] font-bold">${service.icon}</span>
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <div class="text-[16px] font-bold text-on-surface group-hover:text-primary transition-colors">${service.title}</div>
                            ${service.badge ? `<span class="${service.badge.color} animate-soft-pulse text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${service.badge.text}</span>` : ''}
                        </div>
                        <div class="text-[13px] text-secondary font-medium">${service.subtitle}</div>
                    </div>
                    <span class="material-symbols-outlined text-[#d1d6db] group-hover:translate-x-1 transition-all">chevron_right</span>
                </button>
            `).join('');
        }

        function toggleCheck(id) {
            if (state.checkedItems.includes(id)) {
                state.checkedItems = state.checkedItems.filter(i => i !== id);
            } else {
                state.checkedItems.push(id);
            }
            localStorage.setItem('airplane_checklist', JSON.stringify(state.checkedItems));
            renderChecklist();
            updateProgress();
        }

        function updateProgress(isInitial = false) {
            const totalItems = config.checklist;
            const checkedCount = totalItems.filter(item => state.checkedItems.includes(item.id)).length;
            const totalCount = totalItems.length;

            const progressEl = document.getElementById('checklist-progress');
            const successEl = document.getElementById('success-banner');

            if (progressEl) progressEl.innerText = `${checkedCount}/${totalCount}`;

            // 개수만 비교하는 것이 아니라, 실제 모든 항목이 체크되었는지 검증
            const isAllChecked = totalCount > 0 && totalItems.every(item => state.checkedItems.includes(item.id));

            if (isAllChecked) {
                if (successEl) successEl.classList.remove('hidden');
                triggerProfessionalConfetti();

                if (!isInitial) {
                    setTimeout(highlightBenefits, 500);
                }
            } else {
                if (successEl) successEl.classList.add('hidden');
            }
        }

        function triggerProfessionalConfetti() {
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function () {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);

                const particleCount = 50 * (timeLeft / duration);
                confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
                confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
            }, 250);
        }

        function highlightBenefits() {
            const section = document.querySelector('section.bg-white.rounded-xxl');
            if (section) {
                section.classList.add('animate-highlight');
                section.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => {
                    section.classList.remove('animate-highlight');
                }, 1500);
            }
        }

        window.onpopstate = (event) => {
            // 상세 페이지가 제거되었으므로 뒤로가기 로직은 필요 시 다른 용도로 활용 가능
        };

        init();
    </script>
